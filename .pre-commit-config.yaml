# Run with prek (or pre-commit): `prek install`, then `prek run --all-files`.
# Vendored and upstream trees are never linted or rewritten.
exclude: ^(third_party/|java/src/|data/|build/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-added-large-files
        args: [--maxkb=500]
      # A .patch context line keeps its whitespace; LICENSE and fdlibm stay as
      # upstream wrote them.
      - id: end-of-file-fixer
        exclude: (^LICENSE$|\.patch$|^src/jcompat/fdlibm/)
      - id: trailing-whitespace
        exclude: (^LICENSE$|\.patch$|^src/jcompat/fdlibm/)
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # v1.30.1
    hooks:
      - id: zizmor
        args: ["--config", ".zizmor.yml"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # v1.50.3
    hooks:
      - id: typos
        # Report only. The hook's default --write-changes would rewrite
        # genetics terms such as hom (homozygous) into English words in code.
        args: [--force-exclude]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # v0.23.3
    hooks:
      - id: markdownlint-cli2
  # Merges from fast-beagle-5.5 apply its CITATION.cff and DOI badge cleanly,
  # so fail on the 5.5 edition's title, version and Zenodo DOIs.
  - repo: local
    hooks:
      - id: no-5.5-edition-metadata
        name: no fast-beagle 5.5 citation metadata
        language: pygrep
        entry: 'zenodo\.2304810[12]|fast-beagle 5\.5|^version: 5\.5\.'
        exclude: ^\.pre-commit-config\.yaml$
