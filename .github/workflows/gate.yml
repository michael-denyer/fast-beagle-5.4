name: gate

# tests/gate-steps.sh: every check of the pre-merge gate (tests/check-local.sh
# runs the same list). Lint runs in lint.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the tier. Pull requests and pushes to main run the C tier, which
  # compares the C binary against recorded results, unless a pull request
  # changes what those results or the Java-side checks rest on. The nightly run
  # uses the full tier with random fuzz examples, and is skipped when main has
  # not moved since its last success. Manual runs use the full tier.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tier: ${{ steps.plan.outputs.tier }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          run=true tier=c fuzz=fixed
          case $EVENT in
            pull_request)
              if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
                  | grep -E '^(java/|src/jcompat/|tla/|\.github/workflows/gate\.yml$|tests/(jcompat/|fuzz-regressions/|oracle-cases\.txt|trace-cases\.txt|fetch-fixtures\.sh|cases\.sh|gate-steps\.sh|check-oracle\.sh|check-failures\.sh|check-trace\.sh|run-trace\.sh|check-sanitizers\.sh|check-tla\.sh|check-log\.sh|check_fuzz\.py|check_cases\.py|check-bgen\.sh|bgen-cases\.txt|bgen-hashes\.txt|check_bgen_[a-z]+\.py))'; then
                tier=full
              fi ;;
            workflow_dispatch) tier=full fuzz=random ;;
            schedule)
              tier=full fuzz=random
              last=$(gh api "repos/$REPO/actions/workflows/gate.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""')
              if [ "$last" = "$SHA" ]; then run=false; fi ;;
          esac
          echo "run=$run tier=$tier fuzz=$fuzz"
          { echo "run=$run"; echo "tier=$tier"; echo "fuzz=$fuzz"; } >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.11.32
      - name: Install htslib (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /usr/include/htslib/hts.h ] || ! command -v tabix > /dev/null; then
            sudo apt-get update && sudo apt-get install -y libhts-dev tabix
          fi
      - name: Install htslib (macOS)
        if: runner.os == 'macOS'
        run: brew list htslib > /dev/null 2>&1 || brew install htslib
      # The plink2 build tests/check-bgen.sh pins (see docs/testing.md).
      - name: Install plink2 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fSL -o plink2.zip https://s3.amazonaws.com/plink2-assets/alpha7/plink2_linux_x86_64_20260919.zip
          echo "7ded2a083cf6863e997099d1adf5e4b86ad6b5112d2934e2b020cfd77f9bdaeb  plink2.zip" | sha256sum -c -
          unzip -o plink2.zip plink2 -d "$RUNNER_TEMP/plink2"
      - name: Install plink2 (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fSL -o plink2.zip https://s3.amazonaws.com/plink2-assets/alpha7/plink2_mac_arm64_20260919.zip
          echo "04be4b865ad4b79a61b61ba2eb7468b4dbf62674dc5f7c94484fe0e5471539e4  plink2.zip" | shasum -a 256 -c -
          unzip -o plink2.zip plink2 -d "$RUNNER_TEMP/plink2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: fixtures-${{ hashFiles('tests/fetch-fixtures.sh') }}
      - name: Gate
        env:
          GATE_TIER: ${{ needs.plan.outputs.tier }}
          GATE_FUZZ: ${{ needs.plan.outputs.fuzz }}
        run: PLINK2="$RUNNER_TEMP/plink2/plink2" tests/gate-steps.sh .
      - name: Tail of every check log
        if: failure()
        run: tail -n 40 build/check-*.log
      - name: Keep the shrunk fuzz failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-fail-${{ matrix.runner }}
          path: build/fuzz-fail
          if-no-files-found: ignore
